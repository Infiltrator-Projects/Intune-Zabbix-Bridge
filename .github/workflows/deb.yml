name: Debian package

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        run: |
          chmod +x scripts/build-deb.sh
          VERSION="${{ steps.version.outputs.version }}" ./scripts/build-deb.sh

      - name: Verify package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          tmp="$(mktemp -d)"
          dpkg-deb -x dist/*.deb "$tmp"
          python3 -m py_compile             "$tmp/usr/lib/python3/dist-packages/intune_zabbix_bridge/__init__.py"             "$tmp/usr/lib/python3/dist-packages/intune_zabbix_bridge/collector.py"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: intune-zabbix-bridge-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
