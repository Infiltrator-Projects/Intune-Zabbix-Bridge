name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq php-cli nodejs
      - name: Run project tests
        run: ./tools/test.sh
      - name: Build private artifacts
        run: |
          ./tools/build-installer.sh
          ./tools/build-deb.sh
      - name: Inspect artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(jq -r '.version' module/intune_reboot_watch/manifest.json)"
          deb="dist/intune-zabbix-bridge_${version}_all.deb"
          test "$(dpkg-deb --field "$deb" Version)" = "$version"
          test "$(dpkg-deb --field "$deb" Package)" = intune-zabbix-bridge
          test "$(dpkg-deb --field "$deb" Architecture)" = all
          extract="$(mktemp -d)"
          dpkg-deb -x "$deb" "$extract"
          test -x "$extract/usr/lib/intune-zabbix-bridge/import-config"
          test -f "$extract/usr/lib/systemd/system/intune-zabbix-bridge-import.path"
          test ! -e "$extract/etc/intune-zabbix-bridge/bridge.env"
          test -f "$extract/usr/share/doc/intune-zabbix-bridge/intune-zabbix-bridge.env.example"
      - name: Upload private build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intune-zabbix-bridge-private-installers
          path: |
            dist/*.deb
            dist/*.run
          if-no-files-found: error

  release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release '))
      || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download tested private installers
        uses: actions/download-artifact@v4
        with:
          name: intune-zabbix-bridge-private-installers
          path: dist

      - name: Publish versioned private release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          version="$(jq -r '.version' module/intune_reboot_watch/manifest.json)"
          tag="v${version}"
          deb="dist/intune-zabbix-bridge_${version}_all.deb"
          run_file="dist/intune-zabbix-reboot-watch-${version}.run"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$deb" "$run_file" --clobber
            echo "Updated $tag with the exact tested installers."
          else
            notes="$(awk -v version="$version" '
              $0 ~ "^## " version " " { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md)"

            if [[ -z "${notes//[[:space:]]/}" ]]; then
              notes="Private/internal release $version."
            fi

            gh release create "$tag" \
              "$deb" \
              "$run_file" \
              --target "$GITHUB_SHA" \
              --title "Intune Zabbix Bridge $version" \
              --notes "$notes"
          fi

      - name: Build public APT handoff from exact tested DEB
        id: handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(jq -r '.version' module/intune_reboot_watch/manifest.json)"
          deb="dist/intune-zabbix-bridge_${version}_all.deb"
          filename="$(basename "$deb")"
          sha256="$(sha256sum "$deb" | awk '{print $1}')"

          test "$(dpkg-deb --field "$deb" Package)" = intune-zabbix-bridge
          test "$(dpkg-deb --field "$deb" Version)" = "$version"
          test "$(dpkg-deb --field "$deb" Architecture)" = all

          rm -rf apt-handoff
          mkdir -p apt-handoff
          install -m 0644 "$deb" "apt-handoff/$filename"
          : > apt-handoff/.nojekyll
          jq -n \
            --arg package 'intune-zabbix-bridge' \
            --arg version "$version" \
            --arg filename "$filename" \
            --arg sha256 "$sha256" \
            --arg source_sha "$GITHUB_SHA" \
            '{package:$package,version:$version,filename:$filename,sha256:$sha256,source_sha:$source_sha}' \
            > apt-handoff/manifest.json

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Prepared public APT handoff for $filename ($sha256)."

      - name: Configure Pages handoff
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages handoff artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: intune-apt-handoff-${{ github.run_attempt }}
          path: apt-handoff

      - name: Deploy public APT handoff
        id: pages-deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: intune-apt-handoff-${{ github.run_attempt }}

      - name: Verify public APT handoff bytes
        shell: bash
        env:
          VERSION: ${{ steps.handoff.outputs.version }}
          FILENAME: ${{ steps.handoff.outputs.filename }}
          EXPECTED_SHA256: ${{ steps.handoff.outputs.sha256 }}
        run: |
          set -Eeuo pipefail
          base='https://infiltrator-projects.github.io/Intune-Zabbix-Bridge'
          manifest="$base/manifest.json"

          for attempt in $(seq 1 30); do
            tmpdir="$(mktemp -d)"
            trap 'rm -rf "$tmpdir"' EXIT

            if curl -fsS --retry 2 --retry-delay 1 "$manifest?source=$GITHUB_SHA&attempt=$attempt" -o "$tmpdir/manifest.json" \
              && jq -e \
                --arg version "$VERSION" \
                --arg filename "$FILENAME" \
                --arg sha256 "$EXPECTED_SHA256" \
                --arg source_sha "$GITHUB_SHA" \
                '.package == "intune-zabbix-bridge" and .version == $version and .filename == $filename and .sha256 == $sha256 and .source_sha == $source_sha' \
                "$tmpdir/manifest.json" >/dev/null \
              && curl -fsS --retry 2 --retry-delay 1 "$base/$FILENAME?source=$GITHUB_SHA&attempt=$attempt" -o "$tmpdir/$FILENAME" \
              && [[ "$(sha256sum "$tmpdir/$FILENAME" | awk '{print $1}')" == "$EXPECTED_SHA256" ]] \
              && [[ "$(dpkg-deb --field "$tmpdir/$FILENAME" Package)" == intune-zabbix-bridge ]] \
              && [[ "$(dpkg-deb --field "$tmpdir/$FILENAME" Version)" == "$VERSION" ]]; then
              echo "Public APT handoff exposes the exact tested $FILENAME."
              exit 0
            fi

            rm -rf "$tmpdir"
            trap - EXIT
            echo "Waiting for Pages handoff propagation ($attempt/30)..."
            sleep 5
          done

          echo "::error::Public APT handoff did not expose the exact tested DEB."
          exit 1

      - name: Verify central APT publication
        shell: bash
        env:
          VERSION: ${{ steps.handoff.outputs.version }}
          FILENAME: ${{ steps.handoff.outputs.filename }}
          EXPECTED_SHA256: ${{ steps.handoff.outputs.sha256 }}
        run: |
          set -Eeuo pipefail
          base='https://infiltrator-projects.github.io/Infiltrator-Repository'
          catalogue="$base/catalogue/apps.json"
          packages="$base/dists/alpha/main/binary-amd64/Packages.gz"
          pool="$base/pool/main/$FILENAME"

          for attempt in $(seq 1 72); do
            catalogue_ok=false
            packages_ok=false
            pool_ok=false

            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?intune_release=$GITHUB_SHA&attempt=$attempt" \
              | jq -e --arg version "$VERSION" --arg sha256 "$EXPECTED_SHA256" \
                '.[] | select(.id == "intune-zabbix-bridge" and .version == $version and .sha256 == $sha256)' >/dev/null; then
              catalogue_ok=true
            fi

            if curl -fsS --retry 2 --retry-delay 1 "$packages?intune_release=$GITHUB_SHA&attempt=$attempt" \
              | gzip -dc \
              | awk -v version="$VERSION" -v sha256="$EXPECTED_SHA256" '
                  BEGIN { RS=""; found=0 }
                  $0 ~ /(^|\n)Package: intune-zabbix-bridge(\n|$)/ &&
                  $0 ~ ("(^|\\n)Version: " version "(\\n|$)") &&
                  $0 ~ ("(^|\\n)SHA256: " sha256 "(\\n|$)") { found=1 }
                  END { exit(found ? 0 : 1) }
                '; then
              packages_ok=true
            fi

            tmp="$(mktemp)"
            if curl -fsS --retry 2 --retry-delay 1 "$pool?intune_release=$GITHUB_SHA&attempt=$attempt" -o "$tmp" \
              && [[ "$(sha256sum "$tmp" | awk '{print $1}')" == "$EXPECTED_SHA256" ]] \
              && [[ "$(dpkg-deb --field "$tmp" Package)" == intune-zabbix-bridge ]] \
              && [[ "$(dpkg-deb --field "$tmp" Version)" == "$VERSION" ]]; then
              pool_ok=true
            fi
            rm -f "$tmp"

            if [[ "$catalogue_ok" == true && "$packages_ok" == true && "$pool_ok" == true ]]; then
              echo "Public APT repository advertises and serves the exact tested intune-zabbix-bridge ${VERSION}."
              exit 0
            fi

            echo "Waiting for central APT publication of intune-zabbix-bridge ${VERSION} ($attempt/72)..."
            sleep 10
          done

          echo "::error::Private release and public handoff exist, but central APT did not publish the exact tested intune-zabbix-bridge ${VERSION}."
          exit 1
