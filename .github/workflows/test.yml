name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq php-cli nodejs zabbix-sender
      - name: Run project tests
        run: ./tools/test.sh
      - name: Build release artifacts
        run: |
          ./tools/build-installer.sh
          ./tools/build-deb.sh
      - name: Inspect artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(jq -r '.version' module/intune_reboot_watch/manifest.json)"
          run_file="dist/intune-zabbix-reboot-watch-${version}.run"
          deb="dist/intune-zabbix-bridge_${version}_all.deb"
          test -x "$run_file"
          test "$(dpkg-deb --field "$deb" Version)" = "$version"
          test "$(dpkg-deb --field "$deb" Package)" = "intune-zabbix-bridge"
          test -s module/intune_reboot_watch/includes/WidgetForm.php
      - name: Smoke-test portable widget installer
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(jq -r '.version' module/intune_reboot_watch/manifest.json)"
          module_root="$(mktemp -d)"
          trap 'sudo rm -rf "$module_root"' EXIT
          sudo env ZABBIX_MODULE_ROOT="$module_root" "./dist/intune-zabbix-reboot-watch-${version}.run"
          test "$(sudo jq -r '.version' "$module_root/intune_reboot_watch/manifest.json")" = "$version"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intune-zabbix-bridge-installers
          path: |
            dist/*.deb
            dist/*.run
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          version="$(jq -r '.version' module/intune_reboot_watch/manifest.json)"
          tag="v${version}"
          run_file="dist/intune-zabbix-reboot-watch-${version}.run"
          deb="dist/intune-zabbix-bridge_${version}_all.deb"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$run_file" "$deb" --clobber
          else
            gh release create "$tag" "$run_file" "$deb" --target "$GITHUB_SHA" --title "Intune Zabbix Bridge ${version}" --generate-notes
          fi
      - name: Refresh central APT repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release ')
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg repository "$GITHUB_REPOSITORY" --arg sha "$RELEASE_SHA" '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"
          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $DISPATCH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              https://api.github.com/repos/Infiltrator-Projects/Infiltrator-Repository/dispatches
          else
            echo "::warning::APT dispatch token unavailable; repository safety refresh will publish later."
          fi
