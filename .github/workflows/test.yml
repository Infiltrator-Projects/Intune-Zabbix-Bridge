name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq php-cli nodejs
      - name: Run project tests
        run: ./tools/test.sh
      - name: Build private artifacts
        run: |
          ./tools/build-installer.sh
          ./tools/build-deb.sh
      - name: Inspect artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(jq -r '.version' module/intune_reboot_watch/manifest.json)"
          deb="dist/intune-zabbix-bridge_${version}_all.deb"
          test "$(dpkg-deb --field "$deb" Version)" = "$version"
          test "$(dpkg-deb --field "$deb" Package)" = intune-zabbix-bridge
          extract="$(mktemp -d)"
          dpkg-deb -x "$deb" "$extract"
          test -x "$extract/usr/lib/intune-zabbix-bridge/import-config"
          test -f "$extract/usr/lib/systemd/system/intune-zabbix-bridge-import.path"
          test ! -e "$extract/etc/intune-zabbix-bridge/bridge.env"
          test -f "$extract/usr/share/doc/intune-zabbix-bridge/intune-zabbix-bridge.env.example"
      - name: Upload private build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: intune-zabbix-bridge-private-installers
          path: |
            dist/*.deb
            dist/*.run
          if-no-files-found: error

  release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release '))
      || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download tested private installers
        uses: actions/download-artifact@v4
        with:
          name: intune-zabbix-bridge-private-installers
          path: dist

      - name: Publish versioned private release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          version="$(jq -r '.version' module/intune_reboot_watch/manifest.json)"
          tag="v${version}"
          deb="dist/intune-zabbix-bridge_${version}_all.deb"
          run_file="dist/intune-zabbix-reboot-watch-${version}.run"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$deb" "$run_file" --clobber
            echo "Updated $tag with the exact tested installers."
          else
            notes="$(awk -v version="$version" '
              $0 ~ "^## " version " " { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md)"

            if [[ -z "${notes//[[:space:]]/}" ]]; then
              notes="Private/internal release $version."
            fi

            gh release create "$tag" \
              "$deb" \
              "$run_file" \
              --target "$GITHUB_SHA" \
              --title "Intune Zabbix Bridge $version" \
              --notes "$notes"
          fi

      - name: Prepare public credential-free APT export
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(jq -r '.version' module/intune_reboot_watch/manifest.json)"
          deb="dist/intune-zabbix-bridge_${version}_all.deb"
          filename="$(basename "$deb")"
          sha256="$(sha256sum "$deb" | awk '{print $1}')"

          test "$(dpkg-deb --field "$deb" Package)" = intune-zabbix-bridge
          test "$(dpkg-deb --field "$deb" Version)" = "$version"
          test "$(dpkg-deb --field "$deb" Architecture)" = all

          rm -rf apt-export
          mkdir -p apt-export
          install -m 0644 "$deb" "apt-export/$filename"
          : > apt-export/.nojekyll

          jq -n \
            --arg package 'intune-zabbix-bridge' \
            --arg version "$version" \
            --arg filename "$filename" \
            --arg sha256 "$sha256" \
            --arg release_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${version}" \
            --arg source_sha "$GITHUB_SHA" \
            '{schema:1,package:$package,version:$version,filename:$filename,sha256:$sha256,release_url:$release_url,source_sha:$source_sha}' \
            > apt-export/manifest.json

      - name: Configure public APT export Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload public APT export
        uses: actions/upload-pages-artifact@v3
        with:
          name: intune-apt-export-${{ github.run_attempt }}
          path: apt-export

      - name: Deploy public APT export
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: intune-apt-export-${{ github.run_attempt }}

      - name: Verify public APT export
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(jq -r '.version' module/intune_reboot_watch/manifest.json)"
          filename="intune-zabbix-bridge_${version}_all.deb"
          expected_sha256="$(sha256sum "dist/$filename" | awk '{print $1}')"
          base='https://infiltrator-projects.github.io/Intune-Zabbix-Bridge'

          for attempt in $(seq 1 30); do
            manifest="$(curl -fsS --max-time 20 "$base/manifest.json?source=$GITHUB_SHA&attempt=$attempt" 2>/dev/null || true)"
            if [[ -n "$manifest" ]] \
              && jq -e --arg version "$version" --arg filename "$filename" --arg sha256 "$expected_sha256" \
                '.package == "intune-zabbix-bridge" and .version == $version and .filename == $filename and .sha256 == $sha256' \
                <<<"$manifest" >/dev/null; then
              tmp="$(mktemp)"
              if curl -fsS --max-time 30 "$base/$filename?source=$GITHUB_SHA&attempt=$attempt" -o "$tmp" \
                && [[ "$(sha256sum "$tmp" | awk '{print $1}')" == "$expected_sha256" ]] \
                && [[ "$(dpkg-deb --field "$tmp" Package)" == intune-zabbix-bridge ]] \
                && [[ "$(dpkg-deb --field "$tmp" Version)" == "$version" ]]; then
                rm -f "$tmp"
                echo "Public credential-free APT export is live for intune-zabbix-bridge ${version}."
                exit 0
              fi
              rm -f "$tmp"
            fi
            echo "Waiting for public APT export of ${version} ($attempt/30)..."
            sleep 5
          done

          echo "::error::Public APT export did not become available with the exact tested DEB."
          exit 1

      - name: Verify central APT publication
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(jq -r '.version' module/intune_reboot_watch/manifest.json)"
          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          packages='https://infiltrator-projects.github.io/Infiltrator-Repository/dists/alpha/main/binary-amd64/Packages.gz'

          for attempt in $(seq 1 72); do
            catalogue_ok=false
            packages_ok=false

            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?intune_release=$GITHUB_SHA&attempt=$attempt" \
              | jq -e --arg version "$version" \
                '.[] | select(.id == "intune-zabbix-bridge" and .version == $version)' >/dev/null; then
              catalogue_ok=true
            fi

            if curl -fsS --retry 2 --retry-delay 1 "$packages?intune_release=$GITHUB_SHA&attempt=$attempt" \
              | gzip -dc \
              | awk -v version="$version" '
                  BEGIN { RS=""; found=0 }
                  $0 ~ /(^|\n)Package: intune-zabbix-bridge(\n|$)/ &&
                  $0 ~ ("(^|\\n)Version: " version "(\\n|$)") { found=1 }
                  END { exit(found ? 0 : 1) }
                '; then
              packages_ok=true
            fi

            if [[ "$catalogue_ok" == true && "$packages_ok" == true ]]; then
              echo "Public APT repository advertises intune-zabbix-bridge ${version} in catalogue and Packages.gz."
              exit 0
            fi

            echo "Waiting for central APT publication of intune-zabbix-bridge ${version} ($attempt/72)..."
            sleep 10
          done

          echo "::error::Intune release/export exists, but the public APT repository did not publish intune-zabbix-bridge ${version}."
          exit 1
